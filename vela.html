<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Velas 37</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: duas velas de número (3 e 7) num quarto escuro, painel de controle discreto embaixo */
:root{
  --room:#0e0b09; --room-glow:#2a1a0c; --wax-a:#f6e7cf; --wax-b:#d9a85a;
  --ink:#e9dcc6; --muted:#8a7a66; --accent:#ffb347;
  --display:"Fraunces",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--room); color:var(--ink); font-family:var(--mono);
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding-block:24px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden; user-select:none;
}
#glow{position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(circle at 50% 42%, var(--room-glow) 0%, transparent 58%);
  transition:opacity .6s ease}
body.allout #glow{opacity:0}
header{text-align:center; z-index:1}
h1{font-family:var(--display); font-weight:400; font-size:clamp(1.6rem,5vw,2.4rem); margin:0; text-wrap:balance}
#status{margin:.5rem 0 0; color:var(--muted); font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; min-height:1.2em}

.stage{position:relative; display:flex; gap:6px; align-items:flex-end; height:380px; z-index:1}
.cand{position:relative; width:150px; height:380px}
.digit{position:absolute; bottom:-18px; left:0; right:0; text-align:center;
  font:900 250px/1 var(--display); font-variation-settings:"opsz" 144;
  background:repeating-linear-gradient(115deg,var(--wax-a) 0 18px,var(--wax-b) 18px 30px);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 1px rgba(255,220,170,.4))}
.wick{position:absolute; bottom:218px; left:50%; width:4px; height:20px; margin-left:-2px; background:#2b2118; border-radius:2px}
.cand.out .wick{background:linear-gradient(#111 0 60%,#3a2a1c)}
.ember{position:absolute; bottom:234px; left:50%; width:6px; height:6px; margin-left:-3px; border-radius:50%;
  background:#ff5a1f; box-shadow:0 0 8px #ff5a1f; opacity:0; transition:opacity 2.5s ease}
.cand.fresh .ember{opacity:1; transition:none}

.flame{position:absolute; bottom:230px; left:50%; width:38px; height:96px; margin-left:-19px;
  transform-origin:50% 100%; transition:opacity .15s ease; cursor:pointer}
.flame .outer,.flame .inner,.flame .core{position:absolute; left:50%; bottom:0; border-radius:50% 50% 50% 50% / 62% 62% 38% 38%; transform:translateX(-50%)}
.flame .outer{width:38px; height:96px; background:radial-gradient(ellipse at 50% 80%, #fff3c4 0%, #ffc24d 40%, #ff7a1a 75%, rgba(255,80,0,0) 100%);
  filter:blur(1.5px); box-shadow:0 0 60px 18px rgba(255,150,40,.3)}
.flame .inner{width:20px; height:52px; bottom:4px; background:radial-gradient(ellipse at 50% 85%, #fffef5, #ffe7a0 70%, rgba(255,230,150,0))}
.flame .core{width:10px; height:16px; bottom:2px; background:radial-gradient(#3d6bff,#2b47c9 60%,rgba(40,60,200,0)); opacity:.8}
.cand.out .flame{opacity:0; pointer-events:none}
canvas.smoke{position:absolute; left:50%; bottom:226px; width:150px; height:260px; margin-left:-75px; pointer-events:none}

.panel{z-index:1; width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px}
.meter{display:flex; flex-direction:column; gap:6px}
.meter-row{display:flex; justify-content:space-between; font-size:.72rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.bar{position:relative; height:10px; background:#1f1813; border-radius:5px; overflow:hidden}
#lvl{position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(90deg,#6b4a22,var(--accent))}
#thr{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink)}
input[type=range]{width:100%; accent-color:var(--accent)}
.buttons{display:flex; gap:10px; flex-wrap:wrap}
button{flex:1 1 140px; font:500 .9rem var(--mono); padding:12px 14px; border-radius:8px; cursor:pointer;
  border:1px solid #4a3a2a; background:#1a1410; color:var(--ink)}
button.primary{background:var(--accent); color:#1a0f05; border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.hint{font-size:.72rem; color:var(--muted); text-align:center; margin:0}

@media (max-width:420px){
  .stage{height:300px} .cand{width:120px; height:300px}
  .digit{font-size:200px}
  .wick{bottom:172px} .ember{bottom:188px} .flame{bottom:184px; transform:scale(.85)}
  canvas.smoke{bottom:180px}
}
</style>
</head>
<body>
<div id="glow"></div>
<header>
  <h1>Faz um pedido.</h1>
  <p id="status">Liga o microfone e assopra</p>
</header>

<div class="stage">
  <div class="cand" data-i="0">
    <canvas class="smoke" width="150" height="260"></canvas>
    <div class="digit">3</div>
    <div class="ember"></div><div class="wick"></div>
    <div class="flame"><div class="outer"></div><div class="inner"></div><div class="core"></div></div>
  </div>
  <div class="cand" data-i="1">
    <canvas class="smoke" width="150" height="260"></canvas>
    <div class="digit">7</div>
    <div class="ember"></div><div class="wick"></div>
    <div class="flame"><div class="outer"></div><div class="inner"></div><div class="core"></div></div>
  </div>
</div>

<div class="panel">
  <div class="meter">
    <div class="meter-row"><span>Sopro</span><span id="db">—</span></div>
    <div class="bar"><div id="lvl"></div><div id="thr"></div></div>
  </div>
  <div class="meter">
    <div class="meter-row"><span>Sensibilidade</span><span id="sensVal">média</span></div>
    <input id="sens" type="range" min="1" max="10" value="5" aria-label="Sensibilidade">
  </div>
  <div class="buttons">
    <button id="mic" class="primary">Ligar microfone</button>
    <button id="relight" hidden>Acender de novo</button>
  </div>
  <p class="hint">Sem mic? Toca nas chamas pra apagar.</p>
</div>

<script>
const $ = s => document.querySelector(s);
const status=$('#status'), lvlEl=$('#lvl'), thrEl=$('#thr'), sens=$('#sens'), sensVal=$('#sensVal'), dbEl=$('#db');

const cands=[...document.querySelectorAll('.cand')].map((el,i)=>({
  el, flame:el.querySelector('.flame'), cx:el.querySelector('.smoke').getContext('2d'),
  lit:true, wind:0, phase:i*1.7, smoke:[], resist:i?1.15:1 // cada uma apaga num tempo levemente diferente
}));

let analyser, data, blowMs=0, last=performance.now(), noiseFloor=0.01, t=0;

function threshold(){ const s=+sens.value; return Math.max(noiseFloor*2.5, 0.32 - s*0.028); }
function updateSensLabel(){ const s=+sens.value; sensVal.textContent = s<=3?'baixa':s<=7?'média':'alta'; }
sens.addEventListener('input', updateSensLabel);

async function startMic(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=500; // sopro é grave, voz passa menos
    analyser=ctx.createAnalyser(); analyser.fftSize=1024;
    src.connect(lp); lp.connect(analyser);
    data=new Float32Array(analyser.fftSize);
    $('#mic').hidden=true;
    status.textContent='Calibrando… fica quieto 1s';
    const t0=performance.now(); let acc=0,n=0;
    await new Promise(r=>{ const cal=()=>{acc+=rms();n++; performance.now()-t0<1000?requestAnimationFrame(cal):r();}; cal(); });
    noiseFloor=Math.max(0.003,acc/n);
    setStatus();
  }catch(e){ status.textContent='Microfone bloqueado. Toca nas chamas.'; }
}
function rms(){
  if(!analyser) return 0;
  analyser.getFloatTimeDomainData(data);
  let s=0; for(let i=0;i<data.length;i++) s+=data[i]*data[i];
  return Math.sqrt(s/data.length);
}
function litCount(){ return cands.filter(c=>c.lit).length; }
function setStatus(){
  const n=litCount();
  if(n===0){ status.textContent='Parabéns pelos 37! 🎉'; }
  else if(n===1){ status.textContent='Falta uma!'; }
  else status.textContent = analyser ? 'Agora assopra' : 'Liga o microfone e assopra';
}

function blowOut(c){
  if(!c.lit) return;
  c.lit=false; c.el.classList.add('out','fresh');
  setTimeout(()=>c.el.classList.remove('fresh'),60);
  for(let i=0;i<40;i++) c.smoke.push(puff(i*0.04));
  if(litCount()===0){ document.body.classList.add('allout'); $('#relight').hidden=false; }
  setStatus();
}
function relight(){
  cands.forEach(c=>{ c.lit=true; c.el.classList.remove('out'); });
  blowMs=0; document.body.classList.remove('allout'); $('#relight').hidden=true; setStatus();
}
function puff(delay){
  return {x:75+(Math.random()-.5)*4, y:256, vx:(Math.random()-.5)*.3, vy:-(.6+Math.random()*.6),
          r:3+Math.random()*3, life:0, delay, max:2.5+Math.random()*1.5};
}

$('#mic').addEventListener('click', startMic);
$('#relight').addEventListener('click', relight);
cands.forEach(c=>c.flame.addEventListener('click',()=>blowOut(c)));

function frame(now){
  const dt=Math.min(64,now-last); last=now; t+=dt/1000;
  const level=rms(), thr=threshold();
  lvlEl.style.width=Math.min(100,level/0.4*100)+'%';
  thrEl.style.left=Math.min(100,thr/0.4*100)+'%';
  dbEl.textContent = analyser ? (20*Math.log10(level+1e-6)).toFixed(0)+' dB' : '—';

  if(level>thr) blowMs+=dt; else blowMs=Math.max(0,blowMs-dt*0.5);

  for(const c of cands){
    if(c.lit){
      const target = analyser ? Math.min(1,Math.max(0,(level-noiseFloor*1.5)/thr)) : 0;
      c.wind += (target-c.wind)*0.25;
      if(blowMs > 220*c.resist) blowOut(c);
      const tt=t+c.phase;
      const flick=Math.sin(tt*9)*0.03+Math.sin(tt*23)*0.02+(Math.random()-.5)*0.03;
      const lean=c.wind*28+Math.sin(tt*3)*2;
      c.flame.style.transform=`rotate(${lean}deg) scale(${1-flick*0.6+c.wind*0.15},${1+flick-c.wind*0.35})`;
      c.flame.style.opacity=1-c.wind*0.25;
    }
    const cx=c.cx; cx.clearRect(0,0,150,260);
    c.smoke=c.smoke.filter(p=>p.life<p.max);
    for(const p of c.smoke){
      if(p.delay>0){ p.delay-=dt/1000; continue; }
      p.life+=dt/1000;
      p.vx+=Math.sin(t*2+p.y*0.05)*0.01;
      p.x+=p.vx*dt/16; p.y+=p.vy*dt/16; p.r+=0.06*dt/16;
      const k=p.life/p.max, a=(k<0.15?k/0.15:1-(k-0.15)/0.85)*0.22;
      cx.beginPath(); cx.fillStyle=`rgba(200,195,190,${a})`; cx.arc(p.x,p.y,p.r,0,Math.PI*2); cx.fill();
    }
  }
  requestAnimationFrame(frame);
}
updateSensLabel();
requestAnimationFrame(frame);
</script>
</body>
</html>
